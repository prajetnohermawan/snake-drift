<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Snake Drift</title>
<style>
  :root {
    --bg: #0d0f1a;
    --panel: #151829;
    --grid: #1d2138;
    --snake: #4ef0b0;
    --snake-head: #b8ffe4;
    --food: #ff5c8a;
    --text: #e8eaf6;
    --muted: #8a8fb3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: ui-rounded, "SF Pro Rounded", system-ui, sans-serif;
    overflow: hidden; touch-action: none; user-select: none;
  }
  main {
    height: 100%; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; padding: 16px;
  }
  header {
    display: flex; justify-content: space-between; align-items: baseline;
    width: min(92vw, 72vh, 560px);
  }
  h1 { margin: 0; font-size: 22px; letter-spacing: 0.04em; }
  h1 span { color: var(--snake); }
  .stats { display: flex; gap: 18px; font-variant-numeric: tabular-nums; }
  .stat small { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
  .stat b { font-size: 20px; }
  .stage {
    position: relative;
    width: min(92vw, 72vh, 560px); aspect-ratio: 1;
  }
  canvas { width: 100%; height: 100%; display: block; }
  .overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; text-align: center;
    background: rgba(13, 15, 26, 0.72); backdrop-filter: blur(3px);
    border-radius: 18px; padding: 24px;
  }
  .overlay[hidden] { display: none; }
  .overlay h2 { margin: 0; font-size: 34px; }
  .overlay p { margin: 0; color: var(--muted); max-width: 32ch; line-height: 1.45; }
  button {
    margin-top: 8px; font: inherit; font-size: 17px; font-weight: 600;
    padding: 12px 28px; border: 0; border-radius: 999px; cursor: pointer;
    background: var(--snake); color: #062b1f;
  }
  button:hover { filter: brightness(1.1); }
  footer { color: var(--muted); font-size: 13px; text-align: center; }
  kbd {
    font: inherit; font-size: 12px; padding: 1px 6px; border-radius: 5px;
    background: var(--panel); border: 1px solid var(--grid);
  }
</style>
</head>
<body>
<main>
  <header>
    <h1>Snake <span>Drift</span></h1>
    <div class="stats">
      <div class="stat"><small>Score</small><b id="score">0</b></div>
      <div class="stat"><small>Best</small><b id="best">0</b></div>
    </div>
  </header>

  <div class="stage">
    <canvas id="board"></canvas>
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">Snake Drift</h2>
      <p id="ovText">Eat the pink dots. The arena starts to sway and speeds up the more you eat. Arrow keys still follow the grid, not your screen.</p>
      <button id="startBtn">Play</button>
    </div>
  </div>

  <footer><kbd>←↑↓→</kbd> or <kbd>WASD</kbd> to steer · swipe on touch · <kbd>Space</kbd> to pause</footer>
</main>

<script>
(() => {
  const N = 20;                 // grid cells per side
  const BASE_TICK = 140;        // ms per step at start
  const MIN_TICK = 60;          // fastest step

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const ovTitle = document.getElementById('ovTitle');
  const ovText = document.getElementById('ovText');
  const startBtn = document.getElementById('startBtn');

  const DIRS = {
    up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
    left: { x: -1, y: 0 }, right: { x: 1, y: 0 },
  };

  let best = 0;
  try { best = Number(localStorage.getItem('snakeDriftBest')) || 0; } catch {}
  bestEl.textContent = best;

  let snake, dir, queue, food, score, state, lastStep, elapsed, particles;

  function reset() {
    snake = [{ x: 8, y: 10 }, { x: 7, y: 10 }, { x: 6, y: 10 }];
    dir = DIRS.right;
    queue = [];
    score = 0;
    elapsed = 0;
    particles = [];
    scoreEl.textContent = 0;
    placeFood();
  }

  function placeFood() {
    const free = [];
    for (let y = 0; y < N; y++)
      for (let x = 0; x < N; x++)
        if (!snake.some(s => s.x === x && s.y === y)) free.push({ x, y });
    food = free[Math.floor(Math.random() * free.length)];
  }

  // The twist: the arena sways further and faster as your score climbs.
  function swayAngle(t) {
    const amp = Math.min(score * 2.2, 38) * Math.PI / 180;
    const freq = 0.00045 + score * 0.00002;
    return Math.sin(t * freq) * amp;
  }

  function tickMs() {
    return Math.max(MIN_TICK, BASE_TICK - score * 4);
  }

  function turn(name) {
    const next = DIRS[name];
    const last = queue.length ? queue[queue.length - 1] : dir;
    if (next === last || (next.x === -last.x && next.y === -last.y)) return;
    if (queue.length < 3) queue.push(next);
  }

  function step() {
    if (queue.length) dir = queue.shift();
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    const hitWall = head.x < 0 || head.y < 0 || head.x >= N || head.y >= N;
    // The tail moves away this step, so it's safe to move into it (unless we're growing).
    const willEat = !hitWall && head.x === food.x && head.y === food.y;
    const body = willEat ? snake : snake.slice(0, -1);
    const hitSelf = body.some(s => s.x === head.x && s.y === head.y);
    if (hitWall || hitSelf) return gameOver();

    snake.unshift(head);
    if (willEat) {
      score++;
      scoreEl.textContent = score;
      burst(food.x, food.y);
      if (snake.length === N * N) return gameOver(true);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function burst(cx, cy) {
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * Math.PI * 2, v = 0.04 + Math.random() * 0.08;
      particles.push({ x: cx + 0.5, y: cy + 0.5, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 1 });
    }
  }

  function gameOver(won = false) {
    state = 'over';
    const newBest = score > best;
    if (newBest) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('snakeDriftBest', best); } catch {}
    }
    ovTitle.textContent = won ? 'You filled the board!' : 'Game over';
    ovText.textContent = newBest ? `New best: ${score}!` : `Score: ${score}. Best: ${best}.`;
    startBtn.textContent = 'Play again';
    overlay.hidden = false;
  }

  function start() {
    reset();
    state = 'playing';
    overlay.hidden = true;
    lastStep = performance.now();
  }

  function togglePause() {
    if (state === 'playing') {
      state = 'paused';
      ovTitle.textContent = 'Paused';
      ovText.textContent = 'Press Space or tap Resume to keep going.';
      startBtn.textContent = 'Resume';
      overlay.hidden = false;
    } else if (state === 'paused') {
      state = 'playing';
      overlay.hidden = true;
      lastStep = performance.now();
    }
  }

  startBtn.addEventListener('click', () => (state === 'paused' ? togglePause() : start()));

  // --- Input ---
  const KEYS = {
    ArrowUp: 'up', KeyW: 'up', ArrowDown: 'down', KeyS: 'down',
    ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right',
  };
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') {
      e.preventDefault();
      if (state === 'playing' || state === 'paused') togglePause();
      else start();
      return;
    }
    if (e.code === 'Enter' && state !== 'playing') { state === 'paused' ? togglePause() : start(); return; }
    const d = KEYS[e.code];
    if (d && state === 'playing') { e.preventDefault(); turn(d); }
  });

  let touchStart = null;
  window.addEventListener('touchstart', e => {
    const t = e.touches[0];
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });
  window.addEventListener('touchmove', e => {
    if (!touchStart || state !== 'playing') return;
    const t = e.touches[0];
    const dx = t.clientX - touchStart.x, dy = t.clientY - touchStart.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return;
    turn(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
    touchStart = { x: t.clientX, y: t.clientY };
  }, { passive: true });

  // --- Rendering ---
  function resize() {
    const r = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(r.width * dpr);
    canvas.height = Math.round(r.height * dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
  }

  function draw(now) {
    const W = canvas.width;
    // Shrink the board so its corners stay inside the canvas while rotated.
    const size = W / Math.SQRT2 * 0.98;
    const cell = size / N;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, W, W);
    ctx.translate(W / 2, W / 2);
    ctx.rotate(state === 'playing' || state === 'paused' ? swayAngle(elapsed) : 0);
    ctx.translate(-size / 2, -size / 2);

    // Arena
    ctx.fillStyle = '#151829';
    roundRect(-cell * 0.4, -cell * 0.4, size + cell * 0.8, size + cell * 0.8, cell * 0.8);
    ctx.fillStyle = '#1d2138';
    for (let y = 0; y < N; y++)
      for (let x = 0; x < N; x++)
        if ((x + y) % 2 === 0) ctx.fillRect(x * cell, y * cell, cell, cell);

    // Food (pulsing)
    const pulse = 1 + Math.sin(now / 180) * 0.12;
    ctx.fillStyle = '#ff5c8a';
    ctx.shadowColor = '#ff5c8a';
    ctx.shadowBlur = cell * 0.8;
    ctx.beginPath();
    ctx.arc((food.x + 0.5) * cell, (food.y + 0.5) * cell, cell * 0.34 * pulse, 0, Math.PI * 2);
    ctx.fill();

    // Snake
    ctx.shadowColor = '#4ef0b0';
    ctx.shadowBlur = cell * 0.5;
    snake.forEach((s, i) => {
      const t = i / Math.max(snake.length - 1, 1);
      ctx.fillStyle = i === 0 ? '#b8ffe4' : `hsl(${158 - t * 40}, 85%, ${62 - t * 18}%)`;
      const pad = i === 0 ? cell * 0.06 : cell * (0.1 + t * 0.08);
      roundRect(s.x * cell + pad, s.y * cell + pad, cell - pad * 2, cell - pad * 2, cell * 0.3);
    });
    ctx.shadowBlur = 0;

    // Eyes point the way the snake is heading
    const h = snake[0];
    ctx.fillStyle = '#0d0f1a';
    const cx = (h.x + 0.5) * cell, cy = (h.y + 0.5) * cell;
    const px = -dir.y, py = dir.x;
    for (const side of [-1, 1]) {
      ctx.beginPath();
      ctx.arc(cx + dir.x * cell * 0.18 + px * side * cell * 0.18,
              cy + dir.y * cell * 0.18 + py * side * cell * 0.18, cell * 0.08, 0, Math.PI * 2);
      ctx.fill();
    }

    // Particles
    for (const p of particles) {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = '#ff5c8a';
      ctx.beginPath();
      ctx.arc(p.x * cell, p.y * cell, cell * 0.12 * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  let prev = performance.now();
  function loop(now) {
    const dt = now - prev;
    prev = now;
    if (state === 'playing') {
      elapsed += dt;
      while (now - lastStep >= tickMs() && state === 'playing') {
        lastStep += tickMs();
        step();
      }
    }
    particles = particles.filter(p => {
      p.x += p.vx; p.y += p.vy; p.life -= 0.03;
      return p.life > 0;
    });
    draw(now);
    requestAnimationFrame(loop);
  }

  reset();
  state = 'idle';
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
